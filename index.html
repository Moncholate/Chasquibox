<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Víctor Manuel Morales Muñoz">
    <meta name="copyright" content="© 2026 Víctor Manuel Morales Muñoz. Todos los derechos reservados.">
    <script>
    /* Tema de la suite (compartido same-origin con Grammar HUB y las demás en
       moncholate.github.io): fija data-theme antes de pintar.
       gh_theme = auto | light | dark. window.ghTheme = control para el toggle. */
    (function(){try{var K='gh_theme',order=['auto','light','dark'];
      var apply=function(){var m=localStorage.getItem(K)||'auto';
        var dark=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme',dark?'dark':'light');};
      window.ghTheme={get:function(){return localStorage.getItem(K)||'auto';},
        set:function(v){localStorage.setItem(K,v);apply();},
        effective:function(){return document.documentElement.getAttribute("data-theme")||"light";},
        toggle:function(){var n=this.effective()==="dark"?"light":"dark";this.set(n);return n;},apply:apply};
      apply();addEventListener('storage',function(e){if(e.key===K)apply();});
      var mq=matchMedia('(prefers-color-scheme: dark)');
      mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply);
    }catch(e){}})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="description" content="Chasquibox - herramientas de clase para docentes de cualquier asignatura: dado, ruleta, grupos, reloj, sopa de letras, crucigrama, actividades de cierre y notas." />
    <meta property="og:title" content="Chasquibox" />
    <meta property="og:description" content="La caja de herramientas de clase, gratis y sin registrarse." />

    <meta property="og:url" content="https://moncholate.github.io/Chasquibox/" />

    <title>Chasquibox</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
